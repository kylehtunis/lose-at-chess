<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lose at Chess</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Lose at Chess</h1>
    <p class="tagline">
      Play a normal game for a set number of moves, making the worst moves you can.
      Then the engine takes over both sides. Whoever's side loses, wins.
    </p>
  </header>

  <main>
    <section id="config-panel" class="panel">
      <label for="setup-moves">Setup moves per side</label>
      <input id="setup-moves" type="number" min="1" max="40" value="10">
      <button id="start-btn">Start Game</button>
    </section>

    <section id="game-area" hidden>
      <div id="info-bar">
        <span id="phase-label"></span>
        <span id="move-counter"></span>
        <span id="turn-label"></span>
      </div>
      <div id="board-row">
        <div id="eval-bar-wrap" hidden>
          <div id="eval-bar">
            <div id="eval-fill"></div>
            <span id="eval-label"></span>
          </div>
        </div>
        <div id="board"></div>
        <aside id="history-panel">
          <h2>Moves</h2>
          <ol id="move-list"></ol>
        </aside>
      </div>
      <div id="eval-timeline" hidden>
        <div id="eval-loading">
          <span class="spinner"></span>
          Analyzing game... <span id="eval-progress"></span>
        </div>
        <canvas id="eval-canvas"></canvas>
      </div>
    </section>
  </main>

  <div id="result-overlay" hidden>
    <div class="panel result">
      <h2 id="result-title"></h2>
      <p id="result-detail"></p>
      <div class="result-buttons">
        <button id="dismiss-result-btn" class="btn-secondary">View Board</button>
        <button id="play-again-btn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
